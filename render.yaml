databases:
  - name: mineintel-db
    databaseName: mineintel
    plan: free

services:
  - type: web
    name: mineintel-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mineintel-db
          property: connectionString
      - key: EMBEDDING_PROVIDER
        value: hf_api
      - key: HF_API_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
